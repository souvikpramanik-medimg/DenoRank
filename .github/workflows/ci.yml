name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 denorank/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 denorank/ --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Check package imports
        run: python -c "import denorank; from denorank.models import build_segmenter; print('Package import OK')"

      - name: Unit tests (CPU, no GPU or model downloads)
        run: pytest -q tests/
